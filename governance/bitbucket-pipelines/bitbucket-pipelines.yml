# Bitbucket Pipelines Governance Workflow for Terraform

image: hashicorp/terraform:1.9.0

pipelines:
  pull-requests:
    '**':
      - step:
          name: 'Format, Lint & Validate'
          script:
            - terraform fmt -check -recursive
            - wget https://github.com/terraform-linters/tflint/releases/download/v0.50.0/tflint_linux_amd64.zip
            - unzip tflint_linux_amd64.zip -d /usr/local/bin
            - tflint --init
            - tflint -f compact
            - terraform init -backend=false
            - terraform validate

      - step:
          name: 'Security Scan (Checkov)'
          image: bridgecrew/checkov:latest
          script:
            - checkov -d . --compact --quiet

      - step:
          name: 'Documentation Check (terraform-docs)'
          image: quay.io/terraform-docs/terraform-docs:0.18.0
          script:
            - terraform-docs markdown table --output-file README.md --output-mode inject .
